<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Payroll - PayDay</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .payroll-page { max-width: 1440px; margin: 24px auto; padding: 20px; }
    .payroll-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .payroll-header img { width: 220px; height: auto; }
    .payroll-header h1 { margin: 0; font-size: 1.8rem; }
    .payroll-toolbar, .payroll-actions { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
    .payroll-toolbar { padding: 16px 0; border-top: 1px solid #d6dde4; border-bottom: 1px solid #d6dde4; }
    .payroll-toolbar label, .form-row label { display: grid; gap: 6px; font-weight: 600; }
    .payroll-toolbar input { min-height: 42px; padding: 8px 10px; }
    .payroll-summary { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 16px; padding: 18px 0; border-bottom: 1px solid #d6dde4; }
    .summary-item { display: grid; gap: 6px; }
    .summary-item span { color: #536171; font-size: .9rem; }
    .summary-item strong { font-size: 1.35rem; }
    .table-wrap { overflow-x: auto; margin: 16px 0 28px; }
    .payroll-table { width: 100%; min-width: 980px; border-collapse: collapse; }
    .payroll-table th, .payroll-table td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid #d6dde4; }
    .payroll-table th { background: #edf2f5; }
    .payroll-table td.amount, .payroll-table th.amount { text-align: right; white-space: nowrap; }
    .exception { color: #9b321c; font-weight: 600; }
    .ok { color: #216b46; font-weight: 600; }
    .status-line { min-height: 24px; margin: 10px 0; }
    .empty { color: #536171; padding: 18px 0; }
    @media (max-width: 680px) {
      .payroll-page { padding: 14px; }
      .payroll-header { align-items: flex-start; }
      .payroll-header img { width: 145px; }
      .payroll-summary { grid-template-columns: repeat(2, minmax(110px, 1fr)); }
    }
  </style>
</head>
<body>
  <a href="/" class="home-btn">Home</a>
  <main class="payroll-page">
    <header class="payroll-header">
      <a href="/" aria-label="PayDay home"><img src="/static/images/Paydaylines1.png" alt="PayDay"></a>
      <h1>Monthly Payroll</h1>
      <nav class="page-links" aria-label="Payroll navigation">
        <a href="/attendance">Attendance</a>
        <a href="/pay_structure">Pay Structure</a>
      </nav>
    </header>

    <section aria-label="Payroll run controls">
      <div class="payroll-toolbar">
        <label for="cutoffDate">Cutoff date
          <input type="date" id="cutoffDate" required>
        </label>
        <button type="button" id="generateRun">Generate or refresh draft</button>
        <div class="payroll-actions">
          <button type="button" id="approveRun" disabled>Approve run</button>
          <button type="button" id="recordPayments" disabled>Record pending payments</button>
        </div>
      </div>
      <div id="message" class="status-line" role="status" aria-live="polite"></div>
    </section>

    <section class="payroll-summary" aria-label="Payroll summary">
      <div class="summary-item"><span>Payroll total</span><strong id="totalAmount">₹0.00</strong></div>
      <div class="summary-item"><span>Eligible employees</span><strong id="employeeCount">0</strong></div>
      <div class="summary-item"><span>Exceptions</span><strong id="exceptionCount">0</strong></div>
      <div class="summary-item"><span>Run status</span><strong id="runStatus">Not created</strong></div>
    </section>

    <section aria-label="Payroll line items">
      <div class="table-wrap">
        <table class="payroll-table">
          <thead><tr>
            <th>Employee</th><th>Type</th><th>Pay group / term</th>
            <th class="amount">Monthly basis</th><th>Scheduled days</th><th>Present days</th>
            <th class="amount">Pay amount</th><th>Review / payment status</th>
          </tr></thead>
          <tbody id="payrollLines"><tr><td class="empty" colspan="8">Choose a cutoff date and generate a run.</td></tr></tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const message = document.getElementById('message');
    const payrollLines = document.getElementById('payrollLines');
    let currentRun = null;

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.className = `status-line ${isError ? 'exception' : 'ok'}`;
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        headers: { 'Accept': 'application/json', ...(options.body ? {'Content-Type': 'application/json'} : {}), ...options.headers },
        ...options
      });
      const data = await response.json();
      if (!response.ok || data.status !== 'success') throw new Error(data.message || `Request failed (${response.status})`);
      return data;
    }

    function money(value) {
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(Number(value || 0));
    }

    function appendCell(row, value, className = '') {
      const cell = document.createElement('td');
      cell.textContent = value == null || value === '' ? '—' : String(value);
      if (className) cell.className = className;
      row.appendChild(cell);
      return cell;
    }

    function renderRun(run) {
      currentRun = run;
      document.getElementById('totalAmount').textContent = money(run.total_amount);
      document.getElementById('employeeCount').textContent = run.employee_count;
      document.getElementById('exceptionCount').textContent = run.exception_count;
      document.getElementById('runStatus').textContent = run.status.replaceAll('_', ' ');
      document.getElementById('approveRun').disabled = run.status !== 'draft' || run.exception_count > 0;
      document.getElementById('recordPayments').disabled = !['approved', 'partially_paid'].includes(run.status);
      payrollLines.replaceChildren();
      if (!run.lines.length) {
        const row = document.createElement('tr');
        appendCell(row, 'No active employees are eligible for this cutoff.', 'empty');
        row.firstChild.colSpan = 8;
        payrollLines.appendChild(row);
        return;
      }
      for (const line of run.lines) {
        const row = document.createElement('tr');
        appendCell(row, `${line.employee_name} (#${line.empid})`);
        appendCell(row, line.employment_type);
        appendCell(row, [line.pay_group, line.pay_term].filter(Boolean).join(' / '));
        appendCell(row, line.monthly_salary == null ? '—' : money(line.monthly_salary), 'amount');
        appendCell(row, line.scheduled_days);
        appendCell(row, line.present_days);
        appendCell(row, line.line_status === 'ready' ? money(line.amount) : '—', 'amount');
        const statusCell = document.createElement('td');
        if (line.exception_message) {
          statusCell.textContent = line.exception_message;
          statusCell.className = 'exception';
        } else if (line.payment_id) {
          const status = document.createElement('select');
          for (const optionValue of ['pending', 'completed', 'failed']) {
            const option = document.createElement('option');
            option.value = optionValue;
            option.textContent = optionValue;
            option.selected = line.payment_status === optionValue;
            status.appendChild(option);
          }
          const paymentLocked = run.status === 'paid' || line.payment_status === 'completed';
          status.disabled = paymentLocked;
          const save = document.createElement('button');
          save.type = 'button';
          save.textContent = 'Save';
          save.disabled = paymentLocked;
          save.addEventListener('click', async () => {
            try {
              await requestJson(`/payroll/lines/${line.line_id}/payment-status`, {
                method: 'POST', body: JSON.stringify({ payment_status: status.value })
              });
              const result = await requestJson(`/payroll/runs/${run.run_id}`);
              renderRun(result.run);
              setMessage('Payment status updated.');
            } catch (error) { setMessage(error.message, true); }
          });
          statusCell.append(status, document.createTextNode(' '), save);
        } else {
          statusCell.textContent = line.payment_status === 'not_payable' ? 'No payment due' : line.payment_status;
        }
        row.appendChild(statusCell);
        payrollLines.appendChild(row);
      }
    }

    document.getElementById('generateRun').addEventListener('click', async () => {
      const cutoffDate = document.getElementById('cutoffDate').value;
      if (!cutoffDate) { setMessage('Select a cutoff date.', true); return; }
      try {
        const result = await requestJson('/payroll/runs', {
          method: 'POST', body: JSON.stringify({ cutoff_date: cutoffDate })
        });
        renderRun(result.run);
        setMessage(`Payroll draft for ${result.run.period_start} generated. Review exceptions before approval.`);
      } catch (error) { setMessage(error.message, true); }
    });

    document.getElementById('approveRun').addEventListener('click', async () => {
      if (!currentRun) return;
      try {
        const result = await requestJson(`/payroll/runs/${currentRun.run_id}/approve`, { method: 'POST', body: '{}' });
        renderRun(result.run);
        setMessage('Payroll run approved.');
      } catch (error) { setMessage(error.message, true); }
    });

    document.getElementById('recordPayments').addEventListener('click', async () => {
      if (!currentRun) return;
      try {
        const result = await requestJson(`/payroll/runs/${currentRun.run_id}/record-payments`, { method: 'POST', body: '{}' });
        renderRun(result.run);
        setMessage(`${result.recorded_count} pending payment record(s) created. This does not transfer funds.`);
      } catch (error) { setMessage(error.message, true); }
    });

    const today = new Date();
    const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    document.getElementById('cutoffDate').value = localDate;
  </script>
</body>
</html>
